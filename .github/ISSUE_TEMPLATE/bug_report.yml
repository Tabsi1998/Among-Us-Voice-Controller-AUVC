name: Bug report
description: Report a reproducible AUVC problem without credentials or personal data.
title: "bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include game phase, player links and relevant settings without secrets.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: AUVC version (Settings > About), Among Us version and Windows version.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Attach the zip from Settings > Debug > Export diagnostics, which blacks out tokens, credentials and pairing codes. Otherwise doctor output and logs, if available. Never include tokens, pairing codes or credentials.
