name: Feature request
description: Propose a focused improvement for the AUVC roadmap.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
    validations:
      required: true
  - type: textarea
