version: 2

updates:
  - package-ecosystem: gomod
    directory: /bot
    schedule:
      interval: weekly
    # Batch the rest so a quiet week produces one pull request instead of five.
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Only reachable from the Redis layer, which the rest of phase 14 removes
      # (see docs/service-removal.md). Updating them means taking
      # breaking-change risk on code with a scheduled deletion date, and every
      # such pull request has to be triaged and closed again by hand.
      #
      # The PostgreSQL entries are already gone: that layer was deleted rather
      # than kept on a leash.
      - dependency-name: github.com/go-redis/redis/v8
      - dependency-name: github.com/bsm/redislock

  - package-ecosystem: nuget
    directory: /capture
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Capture still targets .NET 5 and these majors need code changes that
      # belong to the .NET LTS migration in phase 11 (#10). Until then a major
      # bump only produces a red pull request. Re-enable them in phase 11.
      - dependency-name: Discord.Net
        update-types: [version-update:semver-major]
      - dependency-name: Config.Net
        update-types: [version-update:semver-major]
      # HandyControl broke on a minor, not a major: 3.0.0 to 3.5.1 changes the
      # ResourceHelper.GetTheme signature and fails the build with CS1501 at
      # capture/AUCapture-WPF/Contributors.xaml.cs:40. Minors are therefore
      # ignored too; patches still come through.
      - dependency-name: HandyControl
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns:
          - "*"
