name: Release

# Only a tag publishes anything. Pushing to main never does, which is what keeps
# "merged" and "released" different words.
#
# workflow_dispatch builds every artifact and publishes none, so the pipeline can
# be exercised without producing a release nobody asked for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # The gates run again against the exact commit being released. Trusting the
  # pull request that led here would mean releasing a combination nothing ever
  # tested.
  verify:
    name: Verify the release commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Go checks
        working-directory: bot
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1
      - name: Repository guards
        run: |
          set -euo pipefail
          python scripts/verify_repository.py
          python scripts/check_upstream_references.py

  bot:
    name: Bot binaries
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - name: Build every target
        working-directory: bot
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) ;; *) version="0.0.0-dev" ;; esac

          mkdir -p ../artifacts/release
          build() {
            local goos="$1" goarch="$2" name="$3" binary="$4"
            local staging
            staging="$(mktemp -d)"

            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$staging/$binary" .

            # The licences travel with the binary. A downloaded executable with
            # no notices beside it is the thing the licence files exist to
            # prevent.
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md "$staging/"
            cp -r ../LICENSES "$staging/"
            cp -r locales "$staging/"

            if [ "$goos" = windows ]; then
              (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/artifacts/release/${name}.zip" .)
            else
              tar -czf "$GITHUB_WORKSPACE/artifacts/release/${name}.tar.gz" -C "$staging" .
            fi
            echo "built ${name}"
          }

          build windows amd64 "AUVC-bot-win-x64" auvc.exe
          build linux   amd64 "AUVC-bot-linux-amd64" auvc
          build linux   arm64 "AUVC-bot-linux-arm64" auvc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-binaries
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  capture:
    name: Capture payload
    needs: verify
    runs-on: windows-2022
    defaults:
      run:
        working-directory: capture
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: capture/global.json
      - run: dotnet restore AmongUsCapture.sln --locked-mode
      - run: dotnet build AmongUsCapture.sln --configuration Release --no-restore
      - run: dotnet test AUVC.Capture.Tests/AUVC.Capture.Tests.csproj --configuration Release --no-build --no-restore
      - name: Publish the self-contained payload
        run: |
          dotnet publish AUCapture-WPF/AUCapture-WPF.csproj --configuration Release `
            --runtime win-x64 --self-contained true -o ../artifacts/capture/win-x64
          Copy-Item ../LICENSE, ../THIRD_PARTY_NOTICES.md ../artifacts/capture/win-x64
          Copy-Item ../LICENSES ../artifacts/capture/win-x64/LICENSES -Recurse
      - name: Check the payload needs no installed .NET
        run: |
          $config = Get-Content ../artifacts/capture/win-x64/AUCapture-WPF.runtimeconfig.json -Raw | ConvertFrom-Json
          if (-not $config.runtimeOptions.includedFrameworks) {
            throw 'The payload is framework-dependent and would need .NET installed on the player machine.'
          }
      - name: Package
        run: |
          New-Item -ItemType Directory -Force ../artifacts/release | Out-Null
          Compress-Archive -Path ../artifacts/capture/win-x64/* `
            -DestinationPath ../artifacts/release/AmongUsVoiceCapture-win-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-payload
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  image:
    name: Bot image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) ;; *) version="0.0.0-dev" ;; esac
          docker build -f deploy/Dockerfile \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            -t auvc:release .
      # A dry run builds the image and stops here. Only a tag pushes, and only
      # to the lowercase path GHCR requires.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          registry="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/amongus-voice-controller"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          docker tag auvc:release "${registry}:${GITHUB_REF_NAME}"
          docker push "${registry}:${GITHUB_REF_NAME}"

          # A pre-release must never become :latest. Somebody pulling latest is
          # asking for the version they are meant to run.
          case "${GITHUB_REF_NAME}" in
            *-alpha.*|*-beta.*|*-rc.*) echo "pre-release; not tagging latest" ;;
            *) docker tag auvc:release "${registry}:latest"; docker push "${registry}:latest" ;;
          esac

  publish:
    name: GitHub release
    needs: [bot, capture, image]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/incoming
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          find artifacts/incoming -type f -print0 | xargs -0 -I{} cp {} artifacts/release/
          cd artifacts/release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # The notes come from the changelog the project keeps by hand.
      # Generating them from commit subjects would produce an accurate list
      # of what changed and a poor answer to what it means.
      - name: Take the notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > artifacts/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-alpha.*|*-beta.*|*-rc.*) prerelease="--prerelease" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" artifacts/release/* \
            --title "AUVC ${GITHUB_REF_NAME}" \
            --notes-file artifacts/notes.md \
            $prerelease
