name: Release

# Only a tag publishes anything. Pushing to main never does, which is what keeps
# "merged" and "released" different words.
#
# workflow_dispatch builds every artifact and publishes none, so the pipeline can
# be exercised without producing a release nobody asked for.
#
# A release is the Windows app: the setup EXE and the portable zip, both with
# the bot inside, plus SHA256SUMS and the notes from CHANGELOG.md.
on:
  push:
    # Releases only, such as v1.2.3. Pre-releases, such as v1.2.3-beta, are built
    # and published from the maintainer's PC with scripts/local_release.py after
    # every check has passed against a fresh copy of the commit. Building them
    # here as well would publish them twice.
    tags: ['v*', '!v*-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # The gates run again against the exact commit being released. Trusting the
  # pull request that led here would mean releasing a combination nothing ever
  # tested.
  verify:
    name: Verify the release commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify_repository.py proves the original upstream imports are
          # ancestors of this commit, which a shallow clone cannot show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Go checks
        working-directory: bot
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1
      - name: Repository guards
        run: |
          set -euo pipefail
          python scripts/verify_repository.py
          python scripts/check_upstream_references.py

  capture:
    name: Capture payload
    needs: verify
    runs-on: windows-2022
    defaults:
      run:
        working-directory: capture
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: capture/global.json
      - run: dotnet restore AmongUsCapture.sln --locked-mode
      - run: dotnet build AmongUsCapture.sln --configuration Release --no-restore
      - run: dotnet test AUVC.Capture.Tests/AUVC.Capture.Tests.csproj --configuration Release --no-build --no-restore
      - name: Publish the self-contained payload
        run: |
          # The app shows its version and compares it with the published
          # releases, so it is stamped with the tag it is built from.
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.0.0-dev' }
          dotnet publish AUCapture-WPF/AUCapture-WPF.csproj --configuration Release `
            --runtime win-x64 --self-contained true -o ../artifacts/capture/win-x64 `
            "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'the app did not publish' }
          Copy-Item ../LICENSE, ../THIRD_PARTY_NOTICES.md ../artifacts/capture/win-x64
          Copy-Item ../LICENSES ../artifacts/capture/win-x64/LICENSES -Recurse
      # The app starts the bot itself, so the bot ships inside the app: the
      # installer and the portable zip both carry bot\auvc.exe.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - name: Put the bot beside the app
        working-directory: bot
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '0.0.0-dev' }
          $target = '../artifacts/capture/win-x64/bot'
          New-Item -ItemType Directory -Force $target | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$env:GITHUB_SHA" -o "$target/auvc.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'the bot did not build' }
      - name: Check the payload needs no installed .NET
        run: |
          $config = Get-Content ../artifacts/capture/win-x64/AUCapture-WPF.runtimeconfig.json -Raw | ConvertFrom-Json
          if (-not $config.runtimeOptions.includedFrameworks) {
            throw 'The payload is framework-dependent and would need .NET installed on the player machine.'
          }
      - name: Package the portable build
        run: |
          New-Item -ItemType Directory -Force ../artifacts/release | Out-Null
          Compress-Archive -Path ../artifacts/capture/win-x64/* `
            -DestinationPath ../artifacts/release/AmongUsVoiceCapture-win-x64.zip
      # The installer wraps the same payload the zip contains, so the two
      # are one application offered two ways rather than two builds that
      # can disagree. It is unsigned: see docs/installer-decision.md.
      - name: Build the installer
        working-directory: installer
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') { $version = '0.0.0' }

          # Inno Setup ships on the hosted Windows image. Installing it
          # when it is missing means a runner image change costs a build
          # rather than a release.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available on this runner" }

          & $iscc `
            "/DAppVersion=$version" `
            "/DPayloadDir=..\artifacts\capture\win-x64" `
            "/DOutputDir=..\artifacts\release" `
            auvc-capture.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-payload
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub release
    needs: [capture]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/incoming
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          find artifacts/incoming -type f -print0 | xargs -0 -I{} cp {} artifacts/release/
          cd artifacts/release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # The notes come from the changelog the project keeps by hand.
      # Generating them from commit subjects would produce an accurate list
      # of what changed and a poor answer to what it means.
      - name: Take the notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > artifacts/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" artifacts/release/* \
            --title "AUVC ${GITHUB_REF_NAME}" \
            --notes-file artifacts/notes.md \
            $prerelease
