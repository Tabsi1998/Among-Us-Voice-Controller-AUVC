ShortDescription: Mutes, deafens and moves players in Discord to match an Among Us round.
Description: |-
  AUVC reads the Among Us round on the PC that plays it and mutes, deafens and moves
  the players in Discord to match. Its Discord bot runs inside the app, so nobody
  else installs anything. An independent community rework of AmongUsCapture and
  AutoMuteUs; not an official AutoMuteUs project.
